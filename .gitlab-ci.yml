python3 - << 'EOF'
import re

with open('.gitlab-ci.yml') as f:
    content = f.read()

old = """trivy-dependency-scan:
  stage: scan
  image: aquasec/trivy
  entrypoint: [""]
  script:
    - trivy fs --exit-code 1 --severity CRITICAL backend/"""

new = """trivy-dependency-scan:
  stage: scan
  image:
    name: aquasec/trivy
    entrypoint: [""]
  script:
    - trivy fs --exit-code 1 --severity CRITICAL backend/"""

content = content.replace(old, new)

with open('.gitlab-ci.yml', 'w') as f:
    f.write(content)

print("Done")
EOF