stages:
  - build
  - test
  - scan

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
  GIT_DEPTH: "0"

cache:
  paths:
    - .m2/repository/
    - .sonar/cache/

default:
  image: maven:3.9-eclipse-temurin-21

build-backend:
  stage: build
  script:
    - cd backend
    - mvn -B clean compile

test-backend:
  stage: test
  services:
    - name: postgres:15-alpine
      alias: postgres
  variables:
    POSTGRES_DB: employees
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ci-only-password
    DB_URL: jdbc:postgresql://postgres:5432/employees
    DB_USER: postgres
    DB_PASSWORD: ci-only-password
  script:
    - cd backend
    - mvn -B test

sonarqube-check:
  tags: [local-sonar]
  stage: scan
  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
  script:
    - |
      set -eu

      if [ -z "${SONAR_HOST_URL:-}" ]; then
        echo "ERROR: SONAR_HOST_URL is not configured"
        exit 1
      fi

      if [ -z "${SONAR_TOKEN:-}" ]; then
        echo "ERROR: SONAR_TOKEN is not configured"
        exit 1
      fi

      cd backend

      mvn -B verify \
        org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
        -DskipTests \
        -Dsonar.projectKey=employee-directory \
        -Dsonar.host.url="$SONAR_HOST_URL" \
        -Dsonar.token="$SONAR_TOKEN" \
        -Dsonar.qualitygate.wait=true
  allow_failure: false
trivy-dependency-scan:
  stage: scan
  image:
    name: aquasec/trivy
    entrypoint: [""]
  cache:
    paths: [.m2/repository]
  before_script:
    - mkdir -p ~/.m2
    - cp -r .m2/repository ~/.m2/repository 2>/dev/null || true
  script:
    - trivy fs --exit-code 1 --severity CRITICAL backend/
  allow_failure: true
